{% extends "base.html" %}

{% block title %}Add Course — It's Tee Time{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add Golf Course</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Name</label>
                        <input type="text" name="name" class="form-control"
                               placeholder="e.g. Pebble Beach Golf Links" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tee Time Booking URL</label>
                        <input type="text" name="url" class="form-control"
                               placeholder="https://..." required>
                        <div class="form-text">Paste the URL of the tee time booking or availability page.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Check Frequency</label>
                        <select name="interval" class="form-select">
                            <option value="30">Every 30 minutes</option>
                            <option value="60" selected>Every 1 hour</option>
                            <option value="120">Every 2 hours</option>
                            <option value="360">Every 6 hours</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-lg me-1"></i>Add Course
                        </button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
