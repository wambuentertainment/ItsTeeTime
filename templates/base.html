<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}It's Tee Time{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f4; }
        .navbar-brand { letter-spacing: -0.5px; }
        .navbar { background-color: #1a5c2e !important; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-radius: 10px; }
        .card-header { border-radius: 10px 10px 0 0 !important; }
        .status-ok { color: #198754; }
        .status-error { color: #dc3545; }
        .status-pending { color: #fd7e14; }
        .badge-active { background-color: #198754; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-5" href="/">
            <i class="bi bi-flag-fill me-2" style="color: #7fff7f;"></i>It's Tee Time
        </a>
        <a href="/courses/add" class="btn btn-sm btn-outline-light">
            <i class="bi bi-plus-lg me-1"></i>Add Course
        </a>
    </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
